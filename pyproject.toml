[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unifiedneurogen"
version = "0.2.0"
description = "Core EEG-conditioned haemodynamic generation implementations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "torch>=2.2,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "tqdm>=4.66,<5", "threadpoolctl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
unifiedneurogen = "unifiedneurogen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
